#   python -m pip install -r requirements.txt -c requirements.lock
#
# CI installs with it, and so does ops/deploy.sh, so what is tested is what
# is deployed: an upstream release cannot turn CI red, or change production,
# on its own (selectolax 1.0 broke the HTML adapters that way).  To upgrade a
# package, change its line here; a dependency added to requirements.txt and
# not listed here installs at its latest version.
