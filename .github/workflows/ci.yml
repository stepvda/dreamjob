# Continuous integration for Dream Job.
#
# Runs on GitHub-hosted runners for every push and pull request.  It is also
# the gate for continuous deployment: when a push to main passes, the last job
# fast-forwards the `deploy` branch to it, and the server (macstudio) deploys
# whatever `deploy` points at - see ops/autodeploy.sh.  Nothing here runs on
# the server, and no secret is needed beyond the job's own GITHUB_TOKEN: the
# repository is public, and a self-hosted runner on a public repository would
# let a pull request run code on the production host.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The frontend first: the build is checked, and the backend's SPA
      # fallback tests need frontend/dist to exist (they skip without it).
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - name: Install backend dependencies
        # The versions production runs; see requirements.lock.
        run: python -m pip install -r requirements.txt -c requirements.lock
      - name: Unit tests
        run: python -m pytest -q -rs tests/unit

  promote:
    name: Promote to deploy
    needs: test
    # Pushes to main only: a pull request never moves what production runs,
    # and its token could not push anyway.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward deploy to this commit
        run: |
          # A re-run of an older commit must not move production back.
          if git rev-parse --verify --quiet origin/deploy >/dev/null &&
             git merge-base --is-ancestor "$GITHUB_SHA" origin/deploy; then
            echo "deploy is already at or past $GITHUB_SHA"
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/deploy"
          echo "deploy -> $GITHUB_SHA"
